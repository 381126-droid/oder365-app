<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高中班級午餐訂餐系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 圖標庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Inter & Noto Sans TC -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
        }
        /* 列印樣式優化 */
        @media print {
            .no-print {
                display: none !important;
            }
            .print-only {
                display: block !important;
            }
            body {
                background-color: white !important;
                color: black !important;
            }
            .card-shadow {
                box-shadow: none !important;
                border: 1px solid #ccc !important;
            }
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col">

    <!-- 頂部導覽列 -->
    <header class="bg-indigo-600 text-white shadow-md no-print">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-utensils text-2xl text-amber-300"></i>
                <h1 class="text-xl md:text-2xl font-bold tracking-wide">高中班級午餐訂餐系統</h1>
            </div>
            <div class="text-xs md:text-sm bg-indigo-700 px-3 py-1.5 rounded-full flex items-center gap-2">
                <i class="fa-solid fa-user-graduate"></i>
                <span>午餐小老師專用面板</span>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">
        
        <!-- 頂部統計摘要卡片 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6 no-print">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-sm text-slate-500 font-medium">總訂餐筆數</p>
                    <p id="summary-total-count" class="text-2xl font-bold text-indigo-600">0 筆</p>
                </div>
                <div class="w-12 h-12 bg-indigo-50 text-indigo-500 rounded-lg flex items-center justify-center text-xl">
                    <i class="fa-solid fa-clipboard-list"></i>
                </div>
            </div>

            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-sm text-slate-500 font-medium">全班總金額</p>
                    <p id="summary-total-amount" class="text-2xl font-bold text-emerald-600">$ 0</p>
                </div>
                <div class="w-12 h-12 bg-emerald-50 text-emerald-500 rounded-lg flex items-center justify-center text-xl">
                    <i class="fa-solid fa-sack-dollar"></i>
                </div>
            </div>

            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-sm text-slate-500 font-medium">訂餐人數 (獨立座號)</p>
                    <p id="summary-students-count" class="text-2xl font-bold text-amber-600">0 人</p>
                </div>
                <div class="w-12 h-12 bg-amber-50 text-amber-500 rounded-lg flex items-center justify-center text-xl">
                    <i class="fa-solid fa-users"></i>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

            <!-- 左半部：菜單 display 與訂餐輸入 (8 欄) -->
            <div class="lg:col-span-7 space-y-6 no-print">

                <!-- 1. 今日菜單展示 -->
                <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                            <i class="fa-solid fa-book-open text-indigo-500"></i> 今日內建菜單
                        </h2>
                        <span class="text-xs text-slate-500">點擊卡片可快速點餐</span>
                    </div>

                    <div id="menu-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                        <!-- 菜單項目由 JS 動態生成 -->
                    </div>
                </section>

                <!-- 2. 訂餐登記輸入面板 -->
                <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                            <i class="fa-solid fa-pen-to-square text-indigo-500"></i> 訂餐登記面板
                        </h2>
                        <span class="text-xs bg-amber-100 text-amber-800 px-2 py-1 rounded font-medium">
                            <i class="fa-solid fa-circle-info"></i> 座號輸入 0 可完成登記並查看報表
                        </span>
                    </div>

                    <!-- 訊息提示視窗 -->
                    <div id="alert-box" class="hidden mb-4 p-3 rounded-lg text-sm flex items-center justify-between transition-all">
                        <div class="flex items-center gap-2">
                            <i id="alert-icon" class="fa-solid"></i>
                            <span id="alert-msg"></span>
                        </div>
                        <button onclick="hideAlert()" class="text-slate-400 hover:text-slate-600">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>

                    <!-- 輸入表單 -->
                    <form id="order-form" onsubmit="handleOrderSubmit(event)" class="space-y-4">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <!-- 座號輸入 -->
                            <div>
                                <label for="student-id" class="block text-sm font-medium text-slate-700 mb-1">
                                    學生座號 <span class="text-xs text-slate-400">(1~50，0 為結束)</span>
                                </label>
                                <div class="relative">
                                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                        <i class="fa-solid fa-id-card"></i>
                                    </div>
                                    <input type="number" id="student-id" min="0" max="50" placeholder="輸入座號 (例: 12)"
                                        class="w-full pl-10 pr-3 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:bg-white focus:outline-none transition" required>
                                </div>
                            </div>

                            <!-- 餐點編號選擇 -->
                            <div>
                                <label for="item-id" class="block text-sm font-medium text-slate-700 mb-1">
                                    餐點編號 <span class="text-xs text-slate-400">(1~5)</span>
                                </label>
                                <div class="relative">
                                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                        <i class="fa-solid fa-list-ol"></i>
                                    </div>
                                    <select id="item-id" 
                                        class="w-full pl-10 pr-3 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:bg-white focus:outline-none transition">
                                        <option value="" disabled selected>請選擇餐點編號...</option>
                                        <option value="1">1. 排骨便當 ($80)</option>
                                        <option value="2">2. 雞腿便當 ($85)</option>
                                        <option value="3">3. 素食便當 ($70)</option>
                                        <option value="4">4. 滷肉飯 ($55)</option>
                                        <option value="5">5. 貢丸湯 ($20)</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- 按鈕操作區 -->
                        <div class="flex gap-3 pt-2">
                            <button type="submit" 
                                class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-xl shadow-sm transition flex items-center justify-center gap-2">
                                <i class="fa-solid fa-plus"></i> 新增訂單
                            </button>
                            <button type="button" onclick="finishOrderProcess()"
                                class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 px-5 rounded-xl shadow-sm transition flex items-center justify-center gap-2">
                                <i class="fa-solid fa-check"></i> 完成結算 (輸入0)
                            </button>
                        </div>
                    </form>
                </section>

                <!-- 即時輸入紀錄清單 (編輯/刪除) -->
                <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="text-md font-bold text-slate-800 flex items-center gap-2">
                            <i class="fa-solid fa-clock-rotate-left text-indigo-500"></i> 已登記明細清單
                        </h3>
                        <button onclick="clearAllOrders()" class="text-xs text-rose-600 hover:text-rose-800 hover:underline flex items-center gap-1">
                            <i class="fa-solid fa-trash-can"></i> 清空所有訂單
                        </button>
                    </div>

                    <div class="overflow-x-auto max-h-64 overflow-y-auto rounded-xl border border-slate-200">
                        <table class="w-full text-sm text-left text-slate-600">
                            <thead class="text-xs text-slate-700 uppercase bg-slate-100 sticky top-0">
                                <tr>
                                    <th class="px-4 py-2.5">#</th>
                                    <th class="px-4 py-2.5">座號</th>
                                    <th class="px-4 py-2.5">餐點名稱</th>
                                    <th class="px-4 py-2.5">單價</th>
                                    <th class="px-4 py-2.5 text-center">操作</th>
                                </tr>
                            </thead>
                            <tbody id="order-log-tbody">
                                <!-- 動態填入 -->
                            </tbody>
                        </table>
                    </div>
                </section>

            </div>

            <!-- 右半部：結算報表區域 (5 欄) -->
            <div class="lg:col-span-5 space-y-6">

                <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 sticky top-6">
                    <!-- 報表標題與操作按鈕 -->
                    <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-200">
                        <div>
                            <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                                <i class="fa-solid fa-file-invoice-dollar text-emerald-600"></i> 午餐訂購統計報表
                            </h2>
                            <p class="text-xs text-slate-400 mt-0.5" id="report-timestamp">尚未完成結算</p>
                        </div>
                        <div class="no-print flex gap-2">
                            <button onclick="window.print()" class="bg-slate-700 hover:bg-slate-800 text-white text-xs px-3 py-2 rounded-lg transition flex items-center gap-1">
                                <i class="fa-solid fa-print"></i> 列印
                            </button>
                        </div>
                    </div>

                    <!-- 列印專用抬頭 -->
                    <div class="hidden print-only mb-4 text-center">
                        <h1 class="text-2xl font-bold">班級午餐訂餐統計報表</h1>
                        <p class="text-sm text-slate-600" id="print-date"></p>
                    </div>

                    <!-- 統計摘要表格 (各品項數量與金額小計) -->
                    <div class="mb-6">
                        <h3 class="text-sm font-semibold text-slate-700 mb-2 flex items-center gap-1">
                            <i class="fa-solid fa-chart-pie text-indigo-500"></i> 各品項訂購統計
                        </h3>
                        <div class="overflow-hidden rounded-xl border border-slate-200">
                            <table class="w-full text-sm">
                                <thead class="bg-slate-50 text-slate-600 text-xs font-semibold">
                                    <tr>
                                        <th class="px-3 py-2 text-left">品項名稱</th>
                                        <th class="px-3 py-2 text-center">單價</th>
                                        <th class="px-3 py-2 text-center">數量</th>
                                        <th class="px-3 py-2 text-right">小計</th>
                                    </tr>
                                </thead>
                                <tbody id="report-summary-tbody" class="divide-y divide-slate-200">
                                    <!-- JS 動態渲染 -->
                                </tbody>
                                <tfoot class="bg-indigo-50/50 font-bold text-slate-800">
                                    <tr>
                                        <td colspan="2" class="px-3 py-2.5 text-left">全班總計</td>
                                        <td id="report-total-count" class="px-3 py-2.5 text-center text-indigo-600">0 份</td>
                                        <td id="report-total-amount" class="px-3 py-2.5 text-right text-emerald-600">$ 0</td>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>
                    </div>

                    <!-- 各座號訂單統計 -->
                    <div>
                        <h3 class="text-sm font-semibold text-slate-700 mb-2 flex items-center gap-1">
                            <i class="fa-solid fa-list-check text-indigo-500"></i> 各座號訂購明細
                        </h3>
                        <div id="student-orders-container" class="space-y-2 max-h-72 overflow-y-auto pr-1">
                            <!-- JS 動態生成 -->
                        </div>
                    </div>

                    <!-- 結帳簽核區 (僅列印時顯示) -->
                    <div class="hidden print-only mt-8 pt-4 border-t border-slate-300 text-sm grid grid-cols-2 gap-4">
                        <div>午餐小老師簽名：________________</div>
                        <div>導師簽章：________________</div>
                    </div>

                </section>

            </div>

        </div>
    </main>

    <!-- 頁尾 -->
    <footer class="bg-white border-t border-slate-200 py-4 mt-auto no-print">
        <div class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-400">
            高中班級午餐訂餐系統 &copy; 原生 JavaScript 開發
        </div>
    </footer>

    <!-- JavaScript 邏輯程式 -->
    <script>
        /**
         * 1. 菜單資料設定 ( Menu Items )
         */
        const MENU = [
            { id: 1, name: '排骨便當', price: 80, icon: 'fa-drumstick-bite', color: 'bg-amber-500' },
            { id: 2, name: '雞腿便當', price: 85, icon: 'fa-bowl-food', color: 'bg-orange-500' },
            { id: 3, name: '素食便當', price: 70, icon: 'fa-leaf', color: 'bg-emerald-500' },
            { id: 4, name: '滷肉飯', price: 55, icon: 'fa-utensils', color: 'bg-red-500' },
            { id: 5, name: '貢丸湯', price: 20, icon: 'fa-mug-hot', color: 'bg-sky-500' }
        ];

        // 訂單狀態儲存陣列: [ { id: Date.now(), studentId: 12, itemId: 1 }, ... ]
        let orders = [];

        /**
         * 頁面初始化
         */
        window.onload = function() {
            renderMenu();
            updateUI();
        };

        /**
         * 渲染菜單卡片
         */
        function renderMenu() {
            const menuContainer = document.getElementById('menu-container');
            menuContainer.innerHTML = '';

            MENU.forEach(item => {
                const card = document.createElement('div');
                card.className = 'border border-slate-200 hover:border-indigo-400 bg-slate-50 hover:bg-indigo-50/30 rounded-xl p-3 cursor-pointer transition flex flex-col justify-between group';
                card.onclick = () => selectMenuItem(item.id);

                card.innerHTML = `
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs font-bold px-2 py-0.5 rounded ${item.color} text-white">
                            #${item.id}
                        </span>
                        <span class="text-xs text-slate-400 group-hover:text-indigo-600 font-medium">點擊選擇</span>
                    </div>
                    <div class="flex items-center gap-3 my-1">
                        <div class="w-10 h-10 rounded-lg ${item.color}/10 text-${item.color.replace('bg-', '')} flex items-center justify-center text-lg">
                            <i class="fa-solid ${item.icon}"></i>
                        </div>
                        <div>
                            <h3 class="font-bold text-slate-800 text-sm">${item.name}</h3>
                            <p class="text-sm font-semibold text-slate-600">$ ${item.price}</p>
                        </div>
                    </div>
                `;
                menuContainer.appendChild(card);
            });
        }

        /**
         * 快捷點擊菜單項目
         */
        function selectMenuItem(itemId) {
            const itemSelect = document.getElementById('item-id');
            itemSelect.value = itemId;
            
            const studentInput = document.getElementById('student-id');
            studentInput.focus();

            showAlert(`已選擇「${getMenuItem(itemId).name}」，請輸入座號後按下 Enter 或點擊新增`, 'info');
        }

        /**
         * 取得菜單品項物件
         */
        function getMenuItem(itemId) {
            return MENU.find(m => m.id === parseInt(itemId));
        }

        /**
         * 處理訂單表單提交
         */
        function handleOrderSubmit(event) {
            event.preventDefault();

            const studentIdInput = document.getElementById('student-id');
            const itemIdSelect = document.getElementById('item-id');

            const studentId = parseInt(studentIdInput.value);
            const itemId = parseInt(itemIdSelect.value);

            // 1. 檢查座號 0 (觸發結束登記)
            if (studentId === 0) {
                finishOrderProcess();
                studentIdInput.value = '';
                return;
            }

            // 2. 輸入驗證 ( Validation )
            if (isNaN(studentId) || studentId < 1 || studentId > 50) {
                showAlert('無效座號！座號必須介於 1 ~ 50 之間。', 'error');
                studentIdInput.focus();
                return;
            }

            if (isNaN(itemId) || itemId < 1 || itemId > 5) {
                showAlert('無效餐點！請選擇 1 ~ 5 範圍內的餐點。', 'error');
                itemIdSelect.focus();
                return;
            }

            // 3. 驗證通過，新增訂單
            const newOrder = {
                id: Date.now() + Math.random(), // 唯一碼
                studentId: studentId,
                itemId: itemId
            };

            orders.push(newOrder);
            
            const item = getMenuItem(itemId);
            showAlert(`成功登記：座號 ${studentId} 號 - ${item.name} ($${item.price})`, 'success');

            // 4. 重置與焦點移動
            studentIdInput.value = '';
            studentIdInput.focus();

            // 5. 更新整體 UI 與報表
            updateUI();
        }

        /**
         * 手動觸發完成登記 (座號 0 或點擊按鈕)
         */
        function finishOrderProcess() {
            if (orders.length === 0) {
                showAlert('目前尚未有任何訂餐紀錄！', 'warning');
                return;
            }

            const now = new Date();
            const timeStr = `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
            
            document.getElementById('report-timestamp').innerText = `統計時間：${timeStr}`;
            document.getElementById('print-date').innerText = `統計日期：${now.toLocaleDateString()}`;

            showAlert('登記流程已完成！結算報表已即時更新。', 'success');

            // 滾動畫面至報表區域 (行動裝置友善)
            const reportElement = document.getElementById('report-summary-tbody');
            if (reportElement) {
                reportElement.scrollIntoView({ behavior: 'smooth' });
            }
        }

        /**
         * 刪除單筆訂單
         */
        function deleteOrder(orderId) {
            orders = orders.filter(o => o.id !== orderId);
            showAlert('已成功刪除該筆訂單', 'info');
            updateUI();
        }

        /**
         * 清空所有訂單
         */
        function clearAllOrders() {
            if (orders.length === 0) return;
            if (confirm('確定要清空所有已登記的訂單嗎？這將無法復原。')) {
                orders = [];
                showAlert('所有訂單已清空', 'info');
                updateUI();
            }
        }

        /**
         * 顯示提示訊息 ( Custom Alert Box )
         */
        function showAlert(message, type = 'info') {
            const alertBox = document.getElementById('alert-box');
            const alertMsg = document.getElementById('alert-msg');
            const alertIcon = document.getElementById('alert-icon');

            alertMsg.innerText = message;
            alertBox.classList.remove('hidden', 'bg-rose-100', 'text-rose-800', 'bg-emerald-100', 'text-emerald-800', 'bg-sky-100', 'text-sky-800', 'bg-amber-100', 'text-amber-800');

            if (type === 'error') {
                alertBox.classList.add('bg-rose-100', 'text-rose-800');
                alertIcon.className = 'fa-solid fa-circle-exclamation text-rose-600';
            } else if (type === 'success') {
                alertBox.classList.add('bg-emerald-100', 'text-emerald-800');
                alertIcon.className = 'fa-solid fa-circle-check text-emerald-600';
            } else if (type === 'warning') {
                alertBox.classList.add('bg-amber-100', 'text-amber-800');
                alertIcon.className = 'fa-solid fa-triangle-exclamation text-amber-600';
            } else {
                alertBox.classList.add('bg-sky-100', 'text-sky-800');
                alertIcon.className = 'fa-solid fa-circle-info text-sky-600';
            }
        }

        function hideAlert() {
            document.getElementById('alert-box').classList.add('hidden');
        }

        /**
         * 更新所有畫面區域 ( UI Renderer )
         */
        function updateUI() {
            renderOrderLogTable();
            renderReportSummary();
            renderStudentOrders();
            updateTopCards();
        }

        /**
         * 更新頂部摘要卡片
         */
        function updateTopCards() {
            const totalCount = orders.length;
            const totalAmount = orders.reduce((sum, order) => {
                const item = getMenuItem(order.itemId);
                return sum + (item ? item.price : 0);
            }, 0);

            // 計算獨立座號數
            const uniqueStudents = new Set(orders.map(o => o.studentId)).size;

            document.getElementById('summary-total-count').innerText = `${totalCount} 筆`;
            document.getElementById('summary-total-amount').innerText = `$ ${totalAmount}`;
            document.getElementById('summary-students-count').innerText = `${uniqueStudents} 人`;
        }

        /**
         * 渲染輸入紀錄表格 (編輯/刪除)
         */
        function renderOrderLogTable() {
            const tbody = document.getElementById('order-log-tbody');
            tbody.innerHTML = '';

            if (orders.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="px-4 py-6 text-center text-slate-400">
                            <i class="fa-solid fa-inbox text-2xl mb-1 block"></i>
                            目前尚未新增任何訂單資料
                        </td>
                    </tr>
                `;
                return;
            }

            // 倒序顯示最新輸入的訂單
            [...orders].reverse().forEach((order, index) => {
                const item = getMenuItem(order.itemId);
                const tr = document.createElement('tr');
                tr.className = 'border-b border-slate-100 hover:bg-slate-50 transition';

                tr.innerHTML = `
                    <td class="px-4 py-2 font-mono text-xs text-slate-400">${orders.length - index}</td>
                    <td class="px-4 py-2 font-bold text-slate-700">${order.studentId} 號</td>
                    <td class="px-4 py-2 text-slate-800">${item.name}</td>
                    <td class="px-4 py-2 text-slate-600">$${item.price}</td>
                    <td class="px-4 py-2 text-center">
                        <button onclick="deleteOrder(${order.id})" 
                            class="text-rose-500 hover:text-rose-700 p-1 rounded hover:bg-rose-50 transition" title="刪除此訂單">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        /**
         * 渲染結算報表 - 各品項統計
         */
        function renderReportSummary() {
            const tbody = document.getElementById('report-summary-tbody');
            tbody.innerHTML = '';

            let grandTotalCount = 0;
            let grandTotalAmount = 0;

            MENU.forEach(menuItem => {
                // 統計該品項總數量
                const count = orders.filter(o => o.itemId === menuItem.id).length;
                const subtotal = count * menuItem.price;

                grandTotalCount += count;
                grandTotalAmount += subtotal;

                const tr = document.createElement('tr');
                tr.className = count > 0 ? 'bg-white' : 'bg-slate-50/50 text-slate-400';

                tr.innerHTML = `
                    <td class="px-3 py-2 font-medium">${menuItem.name}</td>
                    <td class="px-3 py-2 text-center">$${menuItem.price}</td>
                    <td class="px-3 py-2 text-center ${count > 0 ? 'font-bold text-indigo-600' : ''}">${count}</td>
                    <td class="px-3 py-2 text-right ${count > 0 ? 'font-bold text-slate-800' : ''}">$ ${subtotal}</td>
                `;
                tbody.appendChild(tr);
            });

            // 更新報表底部總計
            document.getElementById('report-total-count').innerText = `${grandTotalCount} 份`;
            document.getElementById('report-total-amount').innerText = `$ ${grandTotalAmount}`;
        }

        /**
         * 渲染各座號訂單明細 (依座號排序)
         */
        function renderStudentOrders() {
            const container = document.getElementById('student-orders-container');
            container.innerHTML = '';

            if (orders.length === 0) {
                container.innerHTML = `
                    <p class="text-xs text-slate-400 text-center py-4">無訂購明細</p>
                `;
                return;
            }

            // 按座號分組訂單
            const grouped = {};
            orders.forEach(order => {
                if (!grouped[order.studentId]) {
                    grouped[order.studentId] = [];
                }
                grouped[order.studentId].push(order);
            });

            // 取得所有座號並排序
            const studentIds = Object.keys(grouped).map(Number).sort((a, b) => a - b);

            studentIds.forEach(sid => {
                const studentOrders = grouped[sid];
                const studentTotal = studentOrders.reduce((sum, o) => sum + getMenuItem(o.itemId).price, 0);

                const itemsText = studentOrders.map(o => getMenuItem(o.itemId).name).join(' + ');

                const card = document.createElement('div');
                card.className = 'bg-slate-50 border border-slate-200 rounded-lg p-2.5 flex justify-between items-center text-xs';

                card.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="bg-indigo-100 text-indigo-800 font-bold px-2 py-0.5 rounded">
                            ${sid} 號
                        </span>
                        <span class="text-slate-700 font-medium">${itemsText}</span>
                    </div>
                    <span class="font-bold text-emerald-600">$${studentTotal}</span>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
